# I4B integration test.
#
# Manual trigger only, by necessity: this repository is public, while cbsi-dto/i4b is an
# internal repository behind SAML SSO. A pull_request run cannot clone it -- GITHUB_TOKEN is
# scoped to this repository, and pull requests from forks receive no secrets. Supplying an
# i4b-read token as a secret to a *public* repository would be the wrong trade, so this runs
# on demand in an environment that already has i4b access instead.
#
# Run it locally with `test/i4b/run.sh`; see test/i4b/README.md. If this needs to become an
# automated gate, it belongs in the CI of a private repo that can reach i4b (i4b itself, or
# data-warehouse-ddl), not here.

name: 'i4b-integration'

on:
  workflow_dispatch:
    inputs:
      i4b_ref:
        description: 'i4b revision to test against'
        required: false
        default: '48c9815c8ab6c2e0da221256346d6b45b0a2ed9f'

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  hive-partition-filter:
    name: 'external table require_partition_filter'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v4'

      - name: 'Install i4b-helper prerequisites'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tree
          # i4b-helper requires gcloud to be present; the test never authenticates.
          if ! command -v gcloud >/dev/null; then
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
              | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list >/dev/null
            curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
              | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-cloud-cli
          fi
          if ! command -v yq >/dev/null; then
            sudo curl -fsSL -o /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          fi
          for c in bash terraform tree yq jq curl gcloud realpath python3; do
            printf '%-10s %s\n' "$c" "$(command -v "$c" || echo MISSING)"
          done

      - uses: 'hashicorp/setup-terraform@v3'
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: 'I4B integration test'
        env:
          I4B_REF: '${{ inputs.i4b_ref }}'
        run: 'test/i4b/run.sh'
